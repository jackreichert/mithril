name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck healthcheck.sh calibration/prompt-size.sh hooks/pre-commit scripts/update-check.sh tests/update-check.sh calibration/run.sh tests/calibration-run.sh

      - name: Canonical skill integrity
        run: |
          bash healthcheck.sh --quiet

      - name: Update-check tests
        run: bash tests/update-check.sh

      - name: Calibration runner tests
        run: bash tests/calibration-run.sh
