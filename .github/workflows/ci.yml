name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck install.sh bundle.sh healthcheck.sh calibration/prompt-size.sh hooks/pre-commit

  install-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dry-run install
        run: |
          bash install.sh --dry-run --claude-home /tmp/fake-claude --grok-home /tmp/fake-grok
          # nothing should have been created in dry-run
          test ! -d /tmp/fake-claude/agents
          test ! -d /tmp/fake-grok/agents

      - name: Real install into temp claude-home + grok-home
        run: |
          bash install.sh --claude-home /tmp/fake-claude --grok-home /tmp/fake-grok

      - name: Verify deployed files (Claude + Grok)
        run: |
          set -e
          expected_agents=(
            quality-accessibility quality-architecture quality-code-quality
            quality-concurrency quality-delivery quality-distributed
            quality-flow quality-gates quality-observability quality-patterns
            quality-performance quality-persistence quality-process
            quality-refactor quality-review quality-security-review
            quality-specification quality-test-quality
          )
          for home in /tmp/fake-claude /tmp/fake-grok; do
            test -f "$home/agents/.code-quality-skills-agents" \
              || { echo "missing ownership manifest: $home"; exit 1; }
            for name in "${expected_agents[@]}"; do
              test -f "$home/agents/${name}.md" \
                || { echo "missing: $home/agents/${name}.md"; exit 1; }
            done
            deployed=$(find "$home/agents" -name 'quality-*.md' | wc -l)
            test "$deployed" -eq "${#expected_agents[@]}" \
              || { echo "agent count drift in $home: deployed=$deployed expected=${#expected_agents[@]}"; exit 1; }
            test -f "$home/commands/quality.md" \
              || { echo "missing: $home/commands/quality.md"; exit 1; }
          done
          # Grok host-agnostic orchestrator note must be present
          grep -q 'spawn_subagent' /tmp/fake-grok/commands/quality.md \
            || { echo "orchestrator missing Grok spawn_subagent guidance"; exit 1; }

      - name: Verify canonical agent links
        run: |
          for home in /tmp/fake-claude /tmp/fake-grok; do
            if grep -RIn '${CLAUDE_PLUGIN_ROOT}' "$home/commands"; then
              echo "found unsubstituted \${CLAUDE_PLUGIN_ROOT} token under $home/commands"
              exit 1
            fi
            for agent in "$home/agents"/quality-*.md; do
              test -L "$agent" || { echo "agent is not linked: $agent"; exit 1; }
              name="$(basename "$agent")"
              expected="$GITHUB_WORKSPACE/skills/${name#quality-}"
              test "$(readlink "$agent")" = "$expected" \
                || { echo "$agent does not target $expected"; exit 1; }
            done
          done

      - name: Idempotency check
        run: |
          # Re-running install must produce no writes
          out="$(bash install.sh --claude-home /tmp/fake-claude --grok-home /tmp/fake-grok)"
          echo "$out"
          if echo "$out" | grep -qE "^\s*installed "; then
            echo "second install was not a no-op"
            exit 1
          fi
          if echo "$out" | grep -qE "^\s*backed up "; then
            echo "second install created a backup (should have been unchanged)"
            exit 1
          fi

      - name: Remove stale installer-owned agents
        run: |
          for home in /tmp/fake-claude /tmp/fake-grok; do
            touch "$home/agents/quality-retired.md"
            printf 'quality-retired.md\n' >> "$home/agents/.code-quality-skills-agents"
          done
          bash install.sh --claude-home /tmp/fake-claude --grok-home /tmp/fake-grok
          test ! -e /tmp/fake-claude/agents/quality-retired.md
          test ! -e /tmp/fake-grok/agents/quality-retired.md

      - name: Canonical skill and manifest integrity
        run: |
          test -x bundle.sh
          bash bundle.sh --check
          bash healthcheck.sh --quiet

      - name: Frozen copy install
        run: |
          bash install.sh --copy-agents --claude-only --claude-home /tmp/fake-copy
          test ! -L /tmp/fake-copy/agents/quality-code-quality.md
          cmp skills/code-quality.md /tmp/fake-copy/agents/quality-code-quality.md

      - name: Personalization & linking (--name / --copilot / --link)
        run: |
          set -e
          # Vendor prefix with an @import line that must be stripped when inlined.
          printf '## Vendor Rules\n\n- a placeholder vendor rule\n\n@%s/CONSTITUTION.md\n' \
            "$GITHUB_WORKSPACE" > /tmp/prefix.md

          HOME=/tmp/fake-home bash install.sh \
            --claude-home /tmp/fake-claude \
            --grok-home /tmp/fake-grok \
            --link --name "Test User" \
            --copilot --copilot-prefix /tmp/prefix.md

          # 1. The git-tracked CONSTITUTION.md must NEVER be personalized.
          grep -q 'Hey __USER_NAME__' CONSTITUTION.md \
            || { echo "canonical CONSTITUTION.md lost its __USER_NAME__ placeholder"; exit 1; }
          if grep -q 'Hey Test User' CONSTITUTION.md; then
            echo "FAIL: greeting name leaked into git-tracked CONSTITUTION.md"; exit 1
          fi

          # 2. The deployed copy (gitignored) carries the name.
          grep -q 'Hey Test User' instructions/CONSTITUTION.local.md \
            || { echo "personalized copy missing the greeting name"; exit 1; }

          # 3. Self-contained Copilot file: name present, no leftover placeholder,
          #    vendor prefix inlined, and the prefix's @import line stripped.
          grep -q 'Hey Test User' instructions/copilot-instructions.md || { echo "copilot file missing name"; exit 1; }
          # Check the GREETING specifically — Article IX's prose legitimately mentions the
          # literal __USER_NAME__ token, so a blanket grep would false-positive.
          if grep -q 'Hey __USER_NAME__' instructions/copilot-instructions.md; then echo "copilot greeting still has placeholder"; exit 1; fi
          grep -q 'Vendor Rules' instructions/copilot-instructions.md || { echo "vendor prefix not inlined"; exit 1; }
          if grep -qE '^@.*CONSTITUTION(\.local)?\.md$' instructions/copilot-instructions.md; then
            echo "prefix @import line was not stripped from the inlined copy"; exit 1
          fi

          # 4. Claude import points at the personalized copy, exactly once.
          n=$(grep -cE '^@.*CONSTITUTION(\.local)?\.md$' /tmp/fake-claude/CLAUDE.md)
          test "$n" -eq 1 || { echo "expected exactly 1 Constitution import, got $n"; exit 1; }
          grep -qE '^@.*instructions/CONSTITUTION\.local\.md$' /tmp/fake-claude/CLAUDE.md \
            || { echo "Claude import not pointed at the personalized copy"; exit 1; }

          # 5. Grok global AGENTS.md points at the self-contained (or personalized) file.
          test -L /tmp/fake-grok/AGENTS.md \
            || { echo "Grok AGENTS.md symlink missing"; exit 1; }
          tgt=$(readlink /tmp/fake-grok/AGENTS.md)
          case "$tgt" in
            *CONSTITUTION.local.md|*copilot-instructions.md|*CONSTITUTION.md) ;;
            *) echo "Grok AGENTS.md points at unexpected target: $tgt"; exit 1 ;;
          esac

      - name: Personalization idempotency (re-run without --name preserves the name)
        run: |
          set -e
          HOME=/tmp/fake-home bash install.sh \
            --claude-home /tmp/fake-claude \
            --grok-home /tmp/fake-grok \
            --link --copilot --copilot-prefix /tmp/prefix.md
          # Name preserved from the existing deployed copy (no --name given).
          grep -q 'Hey Test User' instructions/CONSTITUTION.local.md \
            || { echo "name not preserved on re-run without --name"; exit 1; }
          # Import must not be duplicated.
          n=$(grep -cE '^@.*CONSTITUTION(\.local)?\.md$' /tmp/fake-claude/CLAUDE.md)
          test "$n" -eq 1 || { echo "Constitution import duplicated on re-run, got $n"; exit 1; }

      - name: Uninstall tears down the personalized copy + import
        run: |
          set -e
          HOME=/tmp/fake-home bash install.sh \
            --claude-home /tmp/fake-claude \
            --grok-home /tmp/fake-grok \
            --uninstall
          test ! -f instructions/CONSTITUTION.local.md \
            || { echo "uninstall left the personalized copy behind"; exit 1; }
          if grep -qE '^@.*CONSTITUTION(\.local)?\.md$' /tmp/fake-claude/CLAUDE.md; then
            echo "uninstall left a Constitution import line behind"; exit 1
          fi
          test ! -f /tmp/fake-claude/agents/quality-code-quality.md \
            || { echo "uninstall left Claude agents behind"; exit 1; }
          test ! -f /tmp/fake-grok/agents/quality-code-quality.md \
            || { echo "uninstall left Grok agents behind"; exit 1; }
          test ! -e /tmp/fake-grok/AGENTS.md \
            || { echo "uninstall left Grok AGENTS.md behind"; exit 1; }
