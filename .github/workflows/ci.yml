name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck healthcheck.sh calibration/prompt-size.sh hooks/pre-commit hooks/done-verdict.sh scripts/update-check.sh scripts/test-cull.sh scripts/install-local.sh tests/install-local.sh tests/update-check.sh tests/test-cull.sh tests/fixtures/test-cull/tools/fake-runner.sh calibration/run.sh tests/calibration-run.sh scripts/done-check.sh tests/done-check.sh tests/done-hook.sh

      - name: Canonical skill integrity
        run: |
          bash healthcheck.sh --quiet

      - name: Update-check tests
        run: bash tests/update-check.sh

      - name: Install-local tests
        run: bash tests/install-local.sh

      - name: Test-cull tests
        run: bash tests/test-cull.sh

      - name: Done-check tests
        run: bash tests/done-check.sh

      - name: Done-verdict hook tests
        run: bash tests/done-hook.sh

      - name: Calibration runner tests
        run: bash tests/calibration-run.sh

      - name: Install-lite shellcheck
        run: shellcheck scripts/install-lite.sh tests/install-lite.sh

      - name: Install-lite tests
        run: bash tests/install-lite.sh
