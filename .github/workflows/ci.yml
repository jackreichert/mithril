name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck bundle.sh healthcheck.sh calibration/prompt-size.sh hooks/pre-commit

      - name: Canonical skill and manifest integrity
        run: |
          test -x bundle.sh
          bash bundle.sh --check
          bash healthcheck.sh --quiet
