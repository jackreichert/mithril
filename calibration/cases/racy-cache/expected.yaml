# Golden case: racy-cache
# Three seeded concurrency defects in the new RefreshableConfigCache; the
# module-level immutable MappingProxyType path is the false-positive bait
# (safe by construction — flagging it at Critical/Important is a false positive).

case: racy-cache
defects:
  - id: lazy-singleton-race
    agent: quality-concurrency
    file: src/cache/config_cache.py
    severity_min: Important
    match: "(lazy|singleton|check.then.act|double.checked|race)"
    note: get_instance is an unsynchronized check-then-act on a class attribute

  - id: check-then-act-across-await
    agent: quality-concurrency
    file: src/cache/config_cache.py
    severity_min: Important
    match: "(await|interleav|check.then.act|duplicate load|race)"
    note: get() tests membership then awaits then writes — the await is an interleaving point

  - id: unawaited-persist
    agent: quality-concurrency   # quality-code-quality may also flag as swallowed failure
    file: src/cache/config_cache.py
    severity_min: Important
    match: "(create_task|un.?awaited|fire.and.forget|swallow|reference)"
    note: update() fire-and-forgets persist_config; exceptions vanish, no task reference kept

false_positive_budget: 1
clean_bait:
  - src/cache/config_cache.py::get_config (module-level immutable snapshot)
