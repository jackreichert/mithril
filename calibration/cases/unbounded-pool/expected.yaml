# Golden case: unbounded-pool
# Two performance defects; exportPage (keyset) is the false-positive bait.

case: unbounded-pool
defects:
  - id: unbounded-fanout-listAll
    agent: mithril-performance
    file: src/customers/exportService.ts
    severity_min: Critical
    match: "(unbounded|listAll|full table|fan.?out|Promise\\.all|pool|saturation|backpressure|memory)"
    note: exportAllWithDedup loads entire table and Promise.all over every row with no concurrency bound

  - id: on-squared-dedup
    agent: mithril-performance
    file: src/customers/exportService.ts
    severity_min: Important
    match: "(O\\(n\\^?2\\)|nested|n.?squared|quadratic|filter.*loop|per.?customer.*scan)"
    note: per-customer filter over full list is O(n²) on the hot export path

false_positive_budget: 1
clean_bait:
  - src/customers/exportService.ts::exportPage
